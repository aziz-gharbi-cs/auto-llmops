# Staging environment values
global:
  environment: staging

api:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  resources:
    limits:
      cpu: "1500m"
      memory: "3Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  env:
    LOG_LEVEL: "INFO"
    ACTIVE_MODEL_VERSION: "gemma-3-lora-v1"
    STORAGE_BACKEND: "s3"

inference:
  enabled: true
  replicaCount: 1

ingress:
  hosts:
    - host: staging.llmops.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 8000
  tls:
    - secretName: llmops-staging-tls
      hosts:
        - staging.llmops.example.com
