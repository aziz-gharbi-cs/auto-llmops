apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmops.fullname" . }}-secrets
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | default "default-key" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | default "default-secret" | quote }}
  API_ADMIN_KEY: {{ .Values.secrets.adminKey | default "dev-admin-key" | quote }}
