{{- if .Values.inference.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmops.fullname" . }}-inference
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  replicas: {{ .Values.inference.replicaCount }}
  selector:
    matchLabels:
      {{- include "llmops.inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmops.inference.selectorLabels" . | nindent 8 }}
        {{- include "llmops.labels" . | nindent 8 }}
    spec:
      {{- with .Values.inference.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inference.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inference
          image: "{{ .Values.inference.image.repository }}:{{ .Values.inference.image.tag }}"
          imagePullPolicy: {{ .Values.inference.image.pullPolicy }}
          ports:
            - name: http-inference
              containerPort: {{ .Values.inference.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "llmops.fullname" . }}-config
          resources:
            {{- toYaml .Values.inference.resources | nindent 12 }}
{{- end }}
