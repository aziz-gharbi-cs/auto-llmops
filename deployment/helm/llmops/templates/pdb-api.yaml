{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "llmops.fullname" . }}-api-pdb
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "llmops.api.selectorLabels" . | nindent 6 }}
{{- end }}
