apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llmops-prod
  namespace: argocd
  labels:
    environment: production
    app.kubernetes.io/name: llmops
finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/company/llmops.git
    targetRevision: production
    path: deployment/helm/llmops
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: llmops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
