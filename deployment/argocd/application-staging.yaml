apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llmops-staging
  namespace: argocd
  labels:
    environment: staging
    app.kubernetes.io/name: llmops
finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/company/llmops.git
    targetRevision: staging
    path: deployment/helm/llmops
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: llmops-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
