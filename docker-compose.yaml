# Docker Compose for Local Development Stack (Section 33)
# Orchestrates API, Nginx, Qdrant, Redis, and MinIO

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: llmops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - llmops-net

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: llmops-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    expose:
      - "8000"
    depends_on:
      - qdrant
      - redis
      - minio
    networks:
      - llmops-net

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: llmops-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - llmops-net

  redis:
    image: redis:7.4-alpine
    container_name: llmops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - llmops-net

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: llmops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - llmops-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: llmops-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - llmops-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: llmops-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - llmops-net

  loki:
    image: grafana/loki:3.3.2
    container_name: llmops-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - llmops-net

networks:
  llmops-net:
    driver: bridge

volumes:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
