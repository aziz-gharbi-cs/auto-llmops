# Docker Compose for Local Development Stack (Section 33)
# Orchestrates API, Nginx, Qdrant, Redis, and MinIO

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: llmops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - llmops-net

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: llmops-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    expose:
      - "8000"
    depends_on:
      - qdrant
      - redis
      - minio
    networks:
      - llmops-net

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: llmops-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - llmops-net

  redis:
    image: redis:7.4-alpine
    container_name: llmops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - llmops-net

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: llmops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - llmops-net

networks:
  llmops-net:
    driver: bridge

volumes:
  qdrant_data:
  minio_data:
