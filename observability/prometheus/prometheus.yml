global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "llmops-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "llmops-api"

  - job_name: "llmops-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nginx:8080"]
        labels:
          service: "nginx"
